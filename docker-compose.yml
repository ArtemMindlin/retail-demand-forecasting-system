version: '3.8'

services:
  # Django dashboard + operational JSON API
  api:
    build: .
    container_name: retail_forecasting_api
    expose:
      - "8000"
    command: ["uvicorn", "retail_forecasting.api.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - RETAIL_PROJECT__RUN_MODE=score_daily
    restart: unless-stopped
    networks:
      - default
      - caddy


networks:
  caddy:
    external: true
