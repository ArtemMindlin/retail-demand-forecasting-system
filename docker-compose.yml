services:
  # Django dashboard + operational JSON API
  api:
    build: .
    container_name: retail_forecasting_api
    ports:
      - "8000:8000"
    command: ["uvicorn", "retail_forecasting.api.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info", "--access-log"]
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      # The run store: the index and the artifacts it points at. Both are needed -- the
      # database alone names runs whose files would be missing, and the artifact tree alone
      # is a set of UUIDs the dashboard cannot enumerate.
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      # The champion registry, which is mutable state carried across runs.
      - ./models:/app/models
      # In-flight run log, written by the dashboard's own pipeline trigger.
      - ./var:/app/var
    env_file:
      - .env
    environment:
      - RETAIL_PROJECT__RUN_MODE=score_daily
    restart: unless-stopped
    networks:
      - default
      - caddy

networks:
  caddy:
    external: true
