{% extends "base.html" %}

{% block title %}Dashboard · Forecast.ai{% endblock %}

{% block content %}
{% include "partials/kpi_grid.html" %}

<div class="dashboard-chart">
  {% include "partials/chart_block.html" %}
</div>

<div class="academic-header">
  <div class="label-mono">módulos académicos · defensa TFG</div>
  <div class="h-display academic-title">Fundamentos matemáticos</div>
</div>

<div class="grid-academic">
  {% for card in academic_cards %}
    <button type="button" class="glass academic"
            hx-get="{% url 'academic-modal' card.id %}"
            hx-include="closest form, .sidebar form"
            hx-target="#overlay-slot"
            hx-swap="innerHTML">
      <div class="academic-head">
        <div class="academic-icon"
             style="background: linear-gradient(135deg, {{ card.color }}, transparent 140%);
                    border: 1px solid {{ card.color }}55; color: {{ card.color }}">
          {% icon card.icon 16 card.color 2 %}
        </div>
        <div class="chip" style="border-color: {{ card.color }}30">
          <span class="chip-dot" style="background: {{ card.color }}"></span>{{ card.kicker }}
        </div>
      </div>

      <div class="h-display academic-card-title">{{ card.title }}</div>

      <div class="academic-formula" data-latex="{{ card.formula }}" data-display="block"></div>

      <div class="academic-short">{{ card.short|safe }}</div>

      <div class="academic-foot">
        <div class="tnum academic-readout" style="color: {{ card.color }}">{{ card.readout }}</div>
        <div class="academic-open">VER DETALLE {% icon "chevronRight" 11 "var(--text-3)" %}</div>
      </div>
    </button>
  {% endfor %}
</div>
{% endblock %}
