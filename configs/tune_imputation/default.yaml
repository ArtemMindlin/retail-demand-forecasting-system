# Hyperparameter search for the supervised imputer's LGBM teacher (run_mode = tune_imputation).
#
# Separate from imputation_compare.yaml on purpose, even though it shares that study's 500-series
# panel. The two need different `tuning_trials` (3 there, 300 here), and the search must be tuned
# at the SCALE the comparison study runs at: an earlier search inherited experiment.yaml's 50
# series by accident, and its winner measured 12.4% WORSE than the untuned defaults at 500 series.
# See invariant 41 for the measured teacher-size effect.
project:
  random_seed: 42
  run_mode: tune_imputation


dataset:
  hf_dataset_id: Dingdong-Inc/FreshRetailNet-50K
  splits:
    train: data/train.parquet
    eval: data/eval.parquet
  local_cache_dir: data/raw/fresh_retailnet
  processed_panel_dir: data/processed
  use_cache: true
  top_n_series: 500
  min_history_days: 70
  max_rows: null
  horizon: 7


preprocessing:
  drop_negative_sales: true
  fill_missing_values: true
  imputation_strategy: supervised


models:
  models_dir: models
  quantiles: [0.1, 0.5, 0.9]
  seasonal_period: 7
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 6
  use_tuning: false
  tuning_trials: 300
