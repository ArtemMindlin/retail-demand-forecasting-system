project:
  random_seed: 42
  run_mode: fair_cost_backtest


dataset:
  hf_dataset_id: Dingdong-Inc/FreshRetailNet-50K
  splits:
    train: data/train.parquet
    eval: data/eval.parquet
  local_cache_dir: data/raw/fresh_retailnet
  processed_panel_dir: data/processed
  use_cache: true
  top_n_series: 500
  min_history_days: 70
  max_rows: null
  horizon: 7


preprocessing:
  drop_negative_sales: true
  fill_missing_values: true


# Only the store: this mode trains no forecasting model. It reads the supervised imputer's
# tuned params from here.
models:
  models_dir: models


inventory:
  overstock_cost: 1.0
  stockout_cost: 4.0
  clip_negative_orders: true


reporting:
  run_name: fresh_retailnet_v2
