project:
  random_seed: 42
  run_mode: cost_sensitivity

dataset:
  hf_dataset_id: Dingdong-Inc/FreshRetailNet-50K
  splits:
    train: data/train.parquet
    eval: data/eval.parquet
  local_cache_dir: data/raw/fresh_retailnet
  processed_panel_dir: data/processed
  use_cache: false
  top_n_series: 500
  min_history_days: 70
  max_rows: null
  horizon: 7


preprocessing:
  drop_negative_sales: true
  fill_missing_values: true
  imputation_strategy: supervised


models:
  models_dir: models
  quantiles: [0.1, 0.5, 0.9]
  seasonal_period: 7
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 6
  use_tuning: false
  tuning_trials: 1


inventory:
  overstock_cost: 1.0
  stockout_cost: 4.0
  use_series_costs: true
  clip_negative_orders: true
  sensitivity_oat_factors: [0.8, 1.2]
  sensitivity_draws: 300
  sensitivity_scale_span: 0.25
  sensitivity_weight_concentration: 50.0

reporting:
  run_name: fresh_retailnet_large
  make_plots: false
