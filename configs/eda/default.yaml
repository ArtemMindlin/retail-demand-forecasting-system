# Exploratory analysis of the prepared panel.
#
# `dataset.top_n_series` and `dataset.max_rows` are deliberately absent: `run_eda` forces both
# to None so the analysis describes the WHOLE panel, not the subset a model trains on. Setting
# them here would look like it narrowed the analysis and would do nothing.
project:
  random_seed: 42
  run_mode: eda

dataset:
  hf_dataset_id: Dingdong-Inc/FreshRetailNet-50K
  splits:
    train: data/train.parquet
    eval: data/eval.parquet
  local_cache_dir: data/raw/fresh_retailnet
  processed_panel_dir: data/processed
  use_cache: true
  min_history_days: 70
  horizon: 7

preprocessing:
  drop_negative_sales: true
  fill_missing_values: true

reporting:
  output_dir: reports
  run_name: fresh_retailnet_v2
  make_plots: true
