repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["src"]

      # LaTeX no lo mira nadie más: ruff y mypy nunca abren un .tex, así que un commit puede
      # estar verde y dejar la memoria sin compilar. Ver el docstring del script.
      - id: latex-math-spacing
        name: latex math spacing
        entry: uv run python scripts/check_latex_math_spacing.py
        language: system
        files: ^memoria/.*\.tex$

      # On push rather than on commit: the suite takes ~3 minutes, which is too much to pay per
      # commit but the right price before code leaves the machine. ruff and mypy above pass
      # happily on code the suite rejects, so without this a green commit says nothing about
      # whether anything still works.
      #
      # Needs installing once per clone, since pre-commit only wires the hook types it is told
      # to: uv run pre-commit install --hook-type pre-push
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
