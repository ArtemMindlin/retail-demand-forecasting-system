name: Deploy to VPS

# Chained behind CI rather than triggered by the push itself: both used to fire on the
# same push and run in parallel, so a red suite still reached the VPS.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `workflow_run` fires for every CI completion, including pull_request runs and failed
    # ones, so all three conditions are needed. Manual dispatch bypasses them on purpose.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          # Root SSH login is disabled on the host (`PermitRootLogin no`), so the deploy
          # runs as the unprivileged `artem` user, from a checkout under its own home.
          # It must stay sudo-free: sudo prompts for a password here and the action would
          # hang until the job times out.
          username: artem
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Abort if the checkout is missing: without this a failed `cd` would leave the
            # shell in $HOME and run `git reset --hard` against whatever is there.
            set -euo pipefail
            cd /home/artem/retail-demand-forecasting-system
            # Hard-reset to origin so machine-local edits to tracked files can
            # never block the deploy (a failed `git pull` used to leave the VPS
            # on a stale commit while the build cache served old code). All
            # VPS-specific config lives in gitignored files (.env,
            # docker-compose.override.yml) which reset leaves untouched.
            #
            # This stack no longer runs its own Caddy — the host-level shared
            # Caddy (fronting other services on this VPS) reverse-proxies
            # straight to retail_forecasting_api:8000, so this deploy never
            # touches ports 80/443.
            # Deploys the tip of origin/main, not necessarily the commit CI just passed:
            # a push landing while CI runs is picked up by this deploy instead of its own.
            git fetch origin main
            git reset --hard origin/main
            docker compose down || true
            docker compose up -d --build
